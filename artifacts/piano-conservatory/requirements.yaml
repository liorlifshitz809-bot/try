packages:
  "framer-motion": "For playful, whimsical animations in the cartoon UI"
  "simple-peer": "For WebRTC peer-to-peer audio/video connections"
  "@types/simple-peer": "TypeScript definitions for simple-peer"
  "nanoid": "To generate unique peer IDs for WebRTC connections"
  "clsx": "Utility for conditionally joining class names"
  "tailwind-merge": "Utility for merging tailwind classes without conflicts"
  "lucide-react": "Using standard icons where necessary (already installed, but good to ensure)"

