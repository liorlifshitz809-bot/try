notes:
  - "WebSocket endpoint is ws://[host]/ws without an /api prefix."
  - "simple-peer requires global to be defined in vite. A polyfill is added to main.tsx or App.tsx."
  - "Since actual room state relies on the backend broadcasting peer events, the frontend uses WebRTC mesh architecture over the WS signaling channel."
